<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetrahedron to Sphere (S^2)</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: sans-serif; 
        }
        #ui-container { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: rgba(0, 0, 0, 0.7); 
            padding: 15px 20px; 
            border-radius: 8px; 
            z-index: 100;
        }
        .control-group {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type="range"] { width: 200px; }
        button {
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div id="ui-container">
        <div style="font-weight: bold; font-size: 1.1em;">Tetrahedron &harr; S&sup2;</div>
        <div class="control-group">
            <label for="morphSlider">Morph (0.0 to 1.0)</label>
            <input type="range" id="morphSlider" min="0" max="1" step="0.01" value="0">
            <button id="playButton">Play / Pause</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Scene 설정
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 조명
        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(5, 5, 5);
        scene.add(light1);
        
        const light2 = new THREE.DirectionalLight(0xaaaaaa, 0.5);
        light2.position.set(-5, -5, -5);
        scene.add(light2);
        scene.add(new THREE.AmbientLight(0x404040));

        // 2. Tetrahedron Base Vertices
        const r = 1;
        const v0 = new THREE.Vector3(Math.sqrt(8/9)*r, 0, -1/3*r);
        const v1 = new THREE.Vector3(-Math.sqrt(2/9)*r, Math.sqrt(2/3)*r, -1/3*r);
        const v2 = new THREE.Vector3(-Math.sqrt(2/9)*r, -Math.sqrt(2/3)*r, -1/3*r);
        const v3 = new THREE.Vector3(0, 0, r);

        const initialFaces = [
            [v0, v1, v2], [v0, v2, v3], [v0, v3, v1], [v1, v3, v2]
        ];

        // 3. Flat Subdivision
        let triangles = [...initialFaces];
        const detailLevel = 5; 

        for (let i = 0; i < detailLevel; i++) {
            const nextTriangles = [];
            for (let tri of triangles) {
                const t0 = tri[0], t1 = tri[1], t2 = tri[2];
                const m01 = new THREE.Vector3().addVectors(t0, t1).multiplyScalar(0.5);
                const m12 = new THREE.Vector3().addVectors(t1, t2).multiplyScalar(0.5);
                const m20 = new THREE.Vector3().addVectors(t2, t0).multiplyScalar(0.5);

                nextTriangles.push([t0, m01, m20]);
                nextTriangles.push([t1, m12, m01]);
                nextTriangles.push([t2, m20, m12]);
                nextTriangles.push([m01, m12, m20]);
            }
            triangles = nextTriangles;
        }

        // 4. Geometry Data 준비
        const basePositions = [];
        const spherePositions = [];
        const targetRadius = 1.2;

        triangles.forEach(tri => {
            tri.forEach(vertex => {
                basePositions.push(vertex.x, vertex.y, vertex.z);
                
                const sVertex = vertex.clone().normalize().multiplyScalar(targetRadius);
                spherePositions.push(sVertex.x, sVertex.y, sVertex.z);
            });
        });

        // 5. BufferGeometry 생성
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(basePositions, 3));
        geometry.computeVertexNormals();

        const material = new THREE.MeshPhongMaterial({ 
            color: 0x2194ce, 
            emissive: 0x0,
            side: THREE.DoubleSide, 
            flatShading: true,
            shininess: 50
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Edge 렌더링 (Triangulation 확인용)
        const edges = new THREE.EdgesGeometry(geometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
        const line = new THREE.LineSegments(edges, lineMaterial);
        scene.add(line);

        // 6. Interaction 및 Animation 로직
        const slider = document.getElementById('morphSlider');
        const playBtn = document.getElementById('playButton');
        
        let isPlaying = false;
        let animTime = 0;
        let direction = 1;

        function updateMorph(t) {
            const positions = geometry.attributes.position;
            const arr = positions.array;
            for (let i = 0; i < arr.length; i++) {
                arr[i] = basePositions[i] + (spherePositions[i] - basePositions[i]) * t;
            }
            positions.needsUpdate = true;
            geometry.computeVertexNormals();
            
            // Edge 갱신
            line.geometry.dispose();
            line.geometry = new THREE.EdgesGeometry(geometry);
        }

        slider.addEventListener('input', (e) => {
            isPlaying = false;
            animTime = parseFloat(e.target.value);
            updateMorph(animTime);
        });

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
        });

        // 7. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (isPlaying) {
                animTime += 0.01 * direction;
                if (animTime >= 1) { animTime = 1; direction = -1; }
                if (animTime <= 0) { animTime = 0; direction = 1; }
                
                slider.value = animTime;
                updateMorph(animTime);
            }

            renderer.render(scene, camera);
        }
        animate();

        // Window Resize 처리
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
